[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Home course project."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
